name: Security Scanners

on:
  push:
    branches: [main, severity-gates]

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config=auto --sarif --output=semgrep.sarif . || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Send to Shuffle
        run: |
          FINDINGS=$(jq '.runs[0].results | length' semgrep.sarif 2>/dev/null || echo 0)
          if [ "$FINDINGS" -gt 0 ]; then
            RULE=$(jq -r '.runs[0].results[0].ruleId' semgrep.sarif)
            FILE=$(jq -r '.runs[0].results[0].locations[0].physicalLocation.artifactLocation.uri' semgrep.sarif)
            curl -X POST "${{ secrets.SHUFFLE_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"scan_type\": \"cve\", \"source\": \"semgrep\", \"rule\": \"$RULE\", \"file\": \"$FILE\", \"repo\": \"${{ github.repository }}\"}"
          fi
      
      - name: Enforce severity gate
        run: |
          HIGH_COUNT=$(jq '[.runs[0].results[]? | select(.level=="error")] | length' semgrep.sarif 2>/dev/null || echo 0)
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "BLOCKED: $HIGH_COUNT high-severity Semgrep finding(s) detected."
            exit 1
          fi

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          format: json
          output: trivy-results.json

      - name: Send to Shuffle
        run: |
          FINDINGS=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json 2>/dev/null || echo 0)
          if [ "$FINDINGS" -gt 0 ]; then
            CVE_ID=$(jq -r '[.Results[]?.Vulnerabilities[]?][0].VulnerabilityID' trivy-results.json)
            curl -X POST "${{ secrets.SHUFFLE_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"scan_type\": \"cve\", \"source\": \"trivy\", \"cve_id\": \"$CVE_ID\", \"repo\": \"${{ github.repository }}\"}"
          fi

      - name: Enforce severity gate
        run: |
          FAIL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "BLOCKED: $FAIL_COUNT High/Critical Trivy finding(s) detected."
            exit 1
          fi
          
  secrets_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        with:
          report-format: json
          report-path: gitleaks-results.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to Shuffle
        run: |
          if [ -s gitleaks-results.json ] && [ "$(jq '. | length' gitleaks-results.json)" -gt 0 ]; then
            REPO_FILE=$(jq -r '.[0].File' gitleaks-results.json)
            LINE=$(jq -r '.[0].StartLine' gitleaks-results.json)
            curl -X POST "${{ secrets.SHUFFLE_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"scan_type\": \"secret\", \"source\": \"gitleaks\", \"file\": \"$REPO_FILE\", \"line\": \"$LINE\", \"repo\": \"${{ github.repository }}\"}"
          fi

      - name: Enforce severity gate
        run: |
          if [ -s gitleaks-results.json ] && [ "$(jq '. | length' gitleaks-results.json)" -gt 0 ]; then
            echo "BLOCKED: exposed secret detected. Secrets are always treated as Critical."
            exit 1
          fi
          
  dast:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Juice Shop to be ready
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:3000 && break
            echo "Waiting for Juice Shop..."
            sleep 5
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          target: 'http://localhost:3000'

      - name: Send to Shuffle
        run: |
          ZAP_FILE=$(find . -type f -name "report_json.json" -o -name "*zap*.json" | head -n 1)
          if [ -n "$ZAP_FILE" ]; then
            HIGH_COUNT=$(jq '[.site[0].alerts[]? | select(.riskdesc | startswith("High"))] | length' "$ZAP_FILE" 2>/dev/null || echo 0)
            if [ "$HIGH_COUNT" -gt 0 ]; then
              ALERT_NAME=$(jq -r '[.site[0].alerts[]? | select(.riskdesc | startswith("High"))][0].name' "$ZAP_FILE")
              RISK=$(jq -r '[.site[0].alerts[]? | select(.riskdesc | startswith("High"))][0].riskdesc' "$ZAP_FILE")
              curl -X POST "${{ secrets.SHUFFLE_WEBHOOK_URL }}" \
                -H "Content-Type: application/json" \
                -d "{\"scan_type\": \"owasp\", \"source\": \"zap\", \"alert_name\": \"$ALERT_NAME\", \"risk_level\": \"$RISK\", \"url\": \"http://localhost:3000\"}"
            fi
          fi  
             
      - name: Enforce severity gate
        run: |
          ZAP_FILE=$(find . -type f -name "report_json.json" -o -name "*zap*.json" | head -n 1)
          if [ -n "$ZAP_FILE" ]; then
            HIGH_COUNT=$(jq '[.site[0].alerts[]? | select(.riskdesc | startswith("High"))] | length' "$ZAP_FILE" 2>/dev/null || echo 0)
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "BLOCKED: $HIGH_COUNT High-risk ZAP finding(s) detected."
              exit 1
            fi
          fi
